name: Build APK

on:
  push:
    branches: [ main, master ]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # The Android SDK is preinstalled on GitHub's ubuntu runners, so no
      # separate SDK setup action is needed. Licenses are accepted here as a
      # safety net (failures are ignored because they are normally already accepted).
      - name: Accept Android SDK licenses
        continue-on-error: true
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true

      - name: Set up Gradle 8.5
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.5'

      - name: Build debug APK
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: OpenCam-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
