name: Build APK

on:
  push:
    branches: [ main, master ]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Finds a complete Gradle project (settings.gradle.kts + app/build.gradle.kts +
      # app/src/main/AndroidManifest.xml) anywhere in the repo. If none is found, it
      # looks for a .zip file in the repo and extracts it, so uploading the zip works too.
      - name: Locate Gradle project
        id: loc
        run: |
          find_project() {
            local settings=()
            mapfile -d '' settings < <(find "$1" -name settings.gradle.kts -not -path "*/.git/*" -print0)
            for f in "${settings[@]}"; do
              d=$(dirname "$f")
              if [ -f "$d/app/build.gradle.kts" ] && [ -f "$d/app/src/main/AndroidManifest.xml" ]; then
                echo "$d"
                return 0
              fi
            done
            return 1
          }

          dir=$(find_project . || true)

          if [ -z "$dir" ]; then
            echo "No complete project in repo files, looking for a zip..."
            zips=()
            mapfile -d '' zips < <(find . -iname '*.zip' -not -path "./.git/*" -print0)
            for z in "${zips[@]}"; do
              echo "Trying zip: $z"
              rm -rf /tmp/proj && mkdir -p /tmp/proj
              unzip -q -o "$z" -d /tmp/proj || continue
              dir=$(find_project /tmp/proj || true)
              if [ -n "$dir" ]; then break; fi
            done
          fi

          if [ -z "$dir" ]; then
            echo "::error::Could not find a complete Android project. Expected settings.gradle.kts, app/build.gradle.kts and app/src/main/AndroidManifest.xml. See the file list above."
            echo "---- files in repo ----"
            find . -not -path "./.git/*" -type f | sort | head -100
            exit 1
          fi

          echo "Gradle project found in: $dir"
          echo "dir=$dir" >> "$GITHUB_OUTPUT"

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Accept Android SDK licenses
        continue-on-error: true
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true

      - name: Set up Gradle 8.5
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.5'

      - name: Build debug APK
        working-directory: ${{ steps.loc.outputs.dir }}
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: OpenCam-debug-apk
          path: ${{ steps.loc.outputs.dir }}/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
